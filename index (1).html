<script>
'use strict';
/* =====================================================================
   COPY — edit jokes here. Encyclopedia voice: formal, terse.
   Jude's thoughts: lowercase.
   ===================================================================== */
const COPY = {

  pressKey: 'press any key',

    { title: 'KNOWLEDGE',    entry: 'See: all other entries.',            thought: 'it never wanted to save anything.' },
    { title: 'QUEUE',        entry: 'People, in order.',                  thought: "it's finished. up here, anyway." },
    { title: 'LEVER',        entry: "Does the work so a person doesn't have to.", thought: 'they already have an entry for it.' },
    { title: 'JUDE',         entry: 'Clerk. See: LEVER.',                 thought: 'huh.' },
    { blank: true }, // the ending starts here
  ],
  proposalTitle: 'FILING ENGINE, AUTOMATIC.',
  proposalEntry: 'Proposed by Jude, clerk.',
  memoHeader: 'MEMO',
  memoTitle: 'RE: FILING ENGINE.',
  memoBody: 'Denied. The Encyclopedia must be compiled by human hands.',
  memoSign: '— Board of Trustees',
  memoThought: 'r. n through z.',
  readFiled: 'FILED: ',
  readErrors: 'ERRORS NOTICED: 0',
  pileL: '← A–M',
  pileR: 'N–Z →',
  markL: 'A–M',
  markR: 'N–Z',
  endTitle: 'JUST FILING',
};

/* =====================================================================
   TIMING — all in milliseconds. Edit pacing here.
   ===================================================================== */
const TIMING = {
  typeMs: 32,          // Jude's thoughts, per character
  introTypeMs: 42,     // intro narration, per character
  punctPauseMs: 160,   // extra pause after . , ? !
  stampDown: 90,       // stamp travel to page (thunk at the end)
  stampHold: 40,       // stamp rests on page
  slide: 170,          // page slides onto its pile
  drop: 150,           // next page drops from the stack   (down+hold+slide+drop < 500)
  doodleHold: 400,     // blank page sits before the doodle moves
  doodleMove: 1500,    // doodle flies from thought bubble onto blank page
  upChain: 650,        // proposal travels up the chain
  silence: 2200,       // the beat of silence
  memoDrop: 520,       // memo falls back down
  slamDelay: 700,      // pause before the new stack
  slamFall: 420,       // new stack falling
  afterSlam: 2400,     // hold on the new stack before cut to black
  endCardGuard: 900,   // ignore keys this long on the end card
  blinkEvery: 3300,
  blinkLen: 130,
  titleBlink: 550,
};
const SOUND = { volume: 0.5 };

/* =====================================================================
   MUSIC — a deliberately dull office-chiptune loop, synthesized live.
   Notes are MIDI numbers (60 = middle C), one per eighth-note step;
   null = rest. Plays in the intro and while filing; stops for the
   ending's silence and stays off through the memo, slam and end card.
   ===================================================================== */
const MUSIC = {
  enabled: true,
  bpm: 96,
  volume: 0.22,          // relative to SOUND.volume
  melodyVol: 0.10, bassVol: 0.16, tickVol: 0.05,
  melody: [
    72, null, 76, null, 79, null, 76, null,   74, null, 77, null, 81, null, 77, null,
    72, null, 76, null, 79, null, 76, null,   71, null, 74, null, 79, null, null, null,
    72, null, 72, null, 76, null, 72, null,   74, null, 74, null, 77, null, 74, null,
    72, null, 71, null, 69, null, 71, null,   72, null, null, null, 67, null, null, null,
  ],
  bass: [
    48, null, null, null, 43, null, null, null,   50, null, null, null, 45, null, null, null,
    48, null, null, null, 43, null, null, null,   43, null, null, null, 47, null, 50, null,
    48, null, null, null, 43, null, null, null,   50, null, null, null, 45, null, null, null,
    48, null, null, null, 43, null, null, null,   48, null, null, null, 43, null, null, null,
  ],
};

/* Palette (from the references: coral, cream, slate, teal, violet ink) */
const PAL = {
  ink: '#16141f', white: '#ffffff', black: '#000000',
  cream: '#f6edd3', creamD: '#dccfaa', tan: '#c3ad84',
  coral: '#ee9580', coralD: '#d87a69', coralL: '#f6b19e',
  pink: '#f2b8b5', slate: '#8ea8c2', slateD: '#5f7695', slateDD: '#3e4f70',
  teal: '#7cb6b4', tealD: '#4b8987', violet: '#3b3d9c', navy: '#141730',
  skin: '#f3d6b4', skinD: '#d6ac88', tunic: '#6c6db6', tunicD: '#4f4f92',
  visor: '#7cb6b4', visorL: '#a9d6cf', yellow: '#dcd58c',
};

/* ===================================================================== */
const W = 320, H = 180;
const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const base = mk(W, H), over = mk(W, H);
const gBase = base.getContext('2d'), gOver = over.getContext('2d');
let g = gBase;
let S = 1, OX = 0, OY = 0, SHX = 0, SHY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  S = Math.min(cv.width / W, cv.height / H);
  OX = Math.round((cv.width - W * S) / 2); OY = Math.round((cv.height - H * S) / 2);
  wrapCache.clear();
}
addEventListener('resize', resize);

/* ---------- low-res primitives ---------- */
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
function P(x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function L(x0, y0, x1, y1, c, t = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy; g.fillStyle = c; const o = Math.floor(t / 2);
  for (let i = 0; i < 4000; i++) {
    g.fillRect(x0 - o, y0 - o, t, t);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function D(x, y, w, h, c, lvl) { // dither: 1=25% 2=50% 3=75%
  g.fillStyle = c; x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const X = x + i, Y = y + j, a = ((X % 2) + 2) % 2, b = ((Y % 2) + 2) % 2;
    const on = lvl === 1 ? (a === 0 && b === 0) : lvl === 2 ? ((a + b) % 2 === 0) : !(a === 0 && b === 0);
    if (on) g.fillRect(X, Y, 1, 1);
  }
}
function circ(cx, cy, r, c, fill) {
  if (fill) { for (let y = -r; y <= r; y++) { const xx = Math.round(Math.sqrt(Math.max(0, r * r - y * y))); R(cx - xx, cy + y, xx * 2 + 1, 1, c); } }
  else { const n = Math.max(12, Math.round(r * 8)); for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; P(cx + Math.cos(a) * r, cy + Math.sin(a) * r, c); } }
}
function rng(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - (1 - t) * (1 - t), easeIn = t => t * t, easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ---------- full-resolution text ---------- */
function setFont(size) { ctx.font = `700 ${size * S}px ${FONT}`; }
function tw(str, size) { setFont(size); return ctx.measureText(str).width / S; }
function T(str, x, y, size, color, align = 'left') {
  setFont(size); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillText(str, OX + (x + SHX) * S, OY + (y + SHY) * S);
}
const wrapCache = new Map();
function wrap(text, maxW, size) {
  const key = text + '|' + maxW + '|' + size;
  if (wrapCache.has(key)) return wrapCache.get(key);
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (tw(t, size) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  wrapCache.set(key, lines); return lines;
}
function drawTyped(lines, n, x, y, size, lh, color, center) {
  let left = n;
  for (let i = 0; i < lines.length && left > 0; i++) {
    const ln = lines[i], part = ln.slice(0, left); left -= ln.length + 1;
    T(part, center ? x - tw(ln, size) / 2 : x, y + i * lh, size, color);
  }
}

/* ---------- audio (WebAudio, synthesized) ---------- */
let AC = null, MASTER = null, MUSICBUS = null, NOISE = null, muted = false;
function unlockAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = muted ? 0 : SOUND.volume; MASTER.connect(AC.destination);
      MUSICBUS = AC.createGain(); MUSICBUS.gain.value = MUSIC.volume; MUSICBUS.connect(MASTER);
      NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function toggleMute() { muted = !muted; if (MASTER) MASTER.gain.value = muted ? 0 : SOUND.volume; }
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.005); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(MASTER); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, type, f0, f1, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
    s.buffer = NOISE; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = type === 'bandpass' ? 1.2 : 0.7;
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gn); gn.connect(MASTER); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  blip(v) { const j = v === 'jude'; tone('square', j ? 290 + Math.random() * 30 : 560 + Math.random() * 40, j ? 280 : 540, 0.045, 0.05); },
  thunk() { tone('sine', 170, 46, 0.18, 0.7); noise(0.07, 0.35, 'lowpass', 1400, 250); },
  thunkSoft() { tone('sine', 140, 60, 0.12, 0.3); },
  slide() { noise(0.17, 0.2, 'bandpass', 3000, 900); },
  slam() { tone('sine', 95, 26, 0.7, 0.95); tone('square', 60, 30, 0.3, 0.12); noise(0.55, 0.7, 'lowpass', 2500, 90); },
  pop() { tone('triangle', 500, 900, 0.1, 0.18); },
};

/* ---------- background music (lookahead scheduler) ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const music = {
  on: false, step: 0, next: 0,
  note(type, f, t, dur, vol) {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(MUSICBUS); o.start(t); o.stop(t + dur + 0.03);
  },
  tick(t) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
    s.buffer = NOISE; f.type = 'highpass'; f.frequency.value = 6000;
    gn.gain.setValueAtTime(MUSIC.tickVol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(f); f.connect(gn); gn.connect(MUSICBUS); s.start(t, Math.random() * 0.5); s.stop(t + 0.05);
  },
  update(want) {
    if (!AC || !MUSICBUS || !MUSIC.enabled || !want) { this.on = false; return; }
    const stepDur = 60 / MUSIC.bpm / 2;
    if (!this.on || this.next < AC.currentTime - 0.25) { this.on = true; this.step = 0; this.next = AC.currentTime + 0.06; }
    try {
      while (this.next < AC.currentTime + 0.15) {
        const i = this.step, t = this.next, m = MUSIC.melody[i % MUSIC.melody.length], b = MUSIC.bass[i % MUSIC.bass.length];
        if (m != null) this.note('square', mtof(m), t, stepDur * 1.6, MUSIC.melodyVol);
        if (b != null) this.note('triangle', mtof(b), t, stepDur * 3.5, MUSIC.bassVol);
        if (i % 2 === 1) this.tick(t);
        this.next += stepDur; this.step = (this.step + 1) % MUSIC.melody.length;
      }
    } catch (e) {}
  },
};
const musicWanted = () => scene === 'intro' ||
  (scene === 'filing' && F && (F.sub === null || F.sub === 'doodleMove' || F.sub === 'propReady'));

/* ---------- typewriter ---------- */
class Typer {
  constructor(text, ms, voice) { this.text = text; this.n = 0; this.acc = 0; this.ms = ms; this.voice = voice; }
  get done() { return this.n >= this.text.length; }
  finish() { this.n = this.text.length; }
  update(dt) {
    if (this.done) return; this.acc += dt;
    while (!this.done && this.acc >= this.ms) {
      this.acc -= this.ms; const ch = this.text[this.n++];
      if (/[.,!?]/.test(ch) && !this.done) this.acc -= TIMING.punctPauseMs;
      if (ch !== ' ' && this.n % 2 === 1) sfx.blip(this.voice);
    }
  }
}

/* =====================================================================
   ART
   ===================================================================== */
function drawJude(x, y, u, o = {}) {
  const r = (a, b, w, h, c) => R(x + a * u, y + b * u, w * u, h * u, c), B = PAL.ink;
  // body
  r(-1, 13, 14, 12, B); r(0, 14, 12, 11, PAL.tunic); r(9, 14, 3, 11, PAL.tunicD);
  r(4, 13, 4, 2, PAL.cream); r(5, 14, 2, 2, B);
  r(2, 17, 3, 3, PAL.tunicD); r(3, 15, 1, 2, PAL.yellow); // pocket + pencil
  r(5, 12, 2, 2, PAL.skinD); // neck
  // head
  r(1, 0, 10, 12, B); r(0, 1, 12, 10, B); r(1, 1, 10, 10, PAL.skin); r(9, 3, 2, 7, PAL.skinD);
  r(-1, 5, 2, 3, B); r(11, 5, 2, 3, B); // ears
  r(1, 3, 2, 3, B); r(9, 3, 2, 3, B);   // hair under visor
  // visor
  r(0, 0, 12, 3, B); r(1, 1, 10, 2, PAL.visor);
  r(-2, 3, 16, 2, B); r(-1, 3, 14, 1, PAL.visorL);
  r(1, 5, 10, 1, PAL.skinD);
  // eyes
  const look = o.look || 0, ey = 6 + look;
  if (o.blink) { r(3, 7, 2, 1, B); r(7, 7, 2, 1, B); }
  else {
    r(3, ey, 2, 2, B); r(7, ey, 2, 2, B); r(3, ey, 1, 1, PAL.white); r(7, ey, 1, 1, PAL.white);
    if (o.bored && !look) { r(3, 6, 2, 1, PAL.skinD); r(7, 6, 2, 1, PAL.skinD); }
  }
  if (o.bored) { r(3, 8, 2, 1, PAL.pink); r(7, 8, 2, 1, PAL.pink); }
  // mouth
  r(5, 9, 3, 1, B);
  if (o.bored) { r(4, 10, 1, 1, B); r(8, 10, 1, 1, B); }
}

function drawStamp(sx, sy, k = 1) { // (sx,sy) = bottom centre of stamp
  R(sx - 8 * k, sy - 5 * k, 16 * k, 5 * k, PAL.ink); R(sx - 7 * k, sy - 4 * k, 14 * k, 3 * k, PAL.slateD); R(sx - 7 * k, sy - 2 * k, 14 * k, k, PAL.violet);
  R(sx - 2 * k, sy - 11 * k, 4 * k, 6 * k, PAL.ink); R(sx - k, sy - 11 * k, 2 * k, 6 * k, PAL.tan);
  R(sx - 4 * k, sy - 16 * k, 8 * k, 6 * k, PAL.ink); R(sx - 3 * k, sy - 15 * k, 6 * k, 4 * k, PAL.coral); R(sx - 2 * k, sy - 15 * k, 2 * k, k, PAL.coralL);
}

function drawStack(x0, w, yTop, yBase, seed) {
  R(x0 + 3, yBase - 1, w, 3, PAL.slateDD);
  for (let y = yBase; y > yTop; y -= 2) {
    const o = Math.round(Math.sin(y * 0.045 + seed) * 2 + Math.sin(y * 0.11 + seed * 3) * 0.8), yy = y - 2;
    const stick = (((y * 13 + seed * 7) % 23) + 23) % 23 === 0;
    R(x0 + o - 1 - (stick ? 3 : 0), yy, w + 2 + (stick ? 5 : 0), 2, PAL.ink);
    R(x0 + o - (stick ? 3 : 0), yy, w + (stick ? 5 : 0), 1, PAL.cream);
    R(x0 + o, yy + 1, w, 1, PAL.creamD);
    R(x0 + o + w - 4, yy, 4, 2, PAL.tan);
  }
}

function drawMachine(stage, ox, oy, k, c) {
  if (stage < 1) return;
  const l = (a, b, a2, b2) => L(ox + a * k, oy + b * k, ox + a2 * k, oy + b2 * k, c);
  l(2, 43, 54, 43);                       // ground
  l(26, 42, 30, 31); l(30, 31, 34, 42);   // pivot
  l(6, 35, 52, 25);                       // lever
  circ(ox + 6 * k, oy + 35 * k, Math.max(1, Math.round(2 * k)), c, false);
  l(50, 25, 50, 30);                      // stamp
  R(ox + 45 * k, oy + 30 * k, Math.max(2, 11 * k), Math.max(2, 4 * k), c);
  if (stage >= 2) { const xs = [8, 4, 12, 4, 12, 8]; for (let i = 0; i < 5; i++) l(xs[i], 36 + i * 1.4, xs[i + 1], 36 + (i + 1) * 1.4); }
  if (stage >= 3) {
    l(12, 2, 40, 16); l(10, 8, 38, 22);   // chute
    l(18, 7, 25, 10.5);                    // page in chute
    l(41, 21, 46, 36); l(46, 36, 44, 33); l(46, 36, 47, 32); // arrow to stamp
  }
  if (stage >= 4) {
    l(52, 14, 52, 25);                     // stalk
    circ(ox + 52 * k, oy + 10 * k, Math.max(1, Math.round(3.5 * k)), c, false);
    R(ox + 50 * k, oy + 10 * k, Math.max(1, 2 * k), Math.max(1, 2 * k), c); // pupil, looking at chute
    l(49, 5, 48, 3); l(52, 5, 52, 3); l(55, 5, 56, 3); // lashes
  }
}

/* ---------- caches ---------- */
let wallC, deskC; const panels = [];
function withCanvas(w, h, fn) { const c = mk(w, h), prev = g; g = c.getContext('2d'); fn(); g = prev; return c; }

function buildCaches() {
  wallC = withCanvas(W, H, () => {
    R(0, 0, W, H, PAL.coral); D(0, 0, W, 22, PAL.coralD, 2); D(0, 22, W, 16, PAL.coralD, 1);
    const r = rng(3);
    for (let x = 62; x < W;) {
      const w = 6 + Math.floor(r() * 10), h = 12 + Math.floor(r() * 28);
      R(x, 112 - h, w, h, PAL.coralL); D(x, 112 - h, w, h, PAL.coral, 1); R(x, 112 - h, w, 1, PAL.cream);
      x += w + 3 + Math.floor(r() * 6);
    }

    else if (k === 'ArrowRight') arrow(1);
    else if (isAdv(kl) && F.thought) F.thought.finish();
  } else if (scene === 'end') { if (now - sceneT0 > TIMING.endCardGuard) goTitle(); }
});

/* ---------- boot ---------- */
resize(); buildCaches();
let last = 0;
function frame(t) {
  const dt = last ? Math.min(100, t - last) : 16; last = t; now = t;
  try { update(dt); music.update(musicWanted()); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
